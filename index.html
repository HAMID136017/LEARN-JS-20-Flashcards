<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1324">
  <meta name="description" content="فلش‌کارت‌های تعاملی دوره‌های JavaScript و SQL برای یادگیری وب و باگ‌بانتی، همراه با طرح‌وارهٔ سادهٔ هر پاسخ.">
  <title>فلش‌کارت‌های مسیر یادگیری حمید</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1324;--panel:#111d32;--panel2:#17253d;--line:#2b3b55;--text:#edf5ff;--muted:#a9bdd3;--mint:#72e4c0;--gold:#f8cb76;--coral:#ff948c;--blue:#80bfff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#1c3152 0,transparent 33%),radial-gradient(circle at 95% 85%,#153d41 0,transparent 32%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.85}
    button{font:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
    .wrap{width:min(1060px,calc(100% - 32px));margin:auto;padding:28px 0 70px}
    .course-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#0e1a2dcc;backdrop-filter:blur(8px);position:sticky;top:10px;z-index:20;box-shadow:0 14px 35px #0004}
    .brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:800;white-space:nowrap}
    .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--mint),#4e9ecf);color:#07232c}
    .course-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .course-tab{border:1px solid var(--line);background:#14223a;color:var(--muted);border-radius:12px;padding:7px 15px}
    .course-tab:hover{border-color:var(--mint);color:#fff}
    .course-tab[aria-pressed="true"]{background:#23534f;border-color:var(--mint);color:#fff;box-shadow:inset 0 0 0 1px #72e4c055}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}
    .eyebrow{margin:0 0 8px;color:var(--mint);font-size:.82rem;letter-spacing:.02em;font-weight:700}
    h1{font-size:clamp(1.8rem,4vw,3.15rem);line-height:1.45;margin:0 0 12px;letter-spacing:-.04em}
    .intro{max-width:720px;color:var(--muted);margin:0;font-size:.95rem}
    .badge{white-space:nowrap;border:1px solid #376b69;color:var(--mint);border-radius:999px;padding:5px 14px;background:#173233;font-size:.82rem}
    .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:22px 0 18px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip,.ghost{border:1px solid var(--line);background:#14223a;color:var(--muted);border-radius:12px;padding:7px 13px}
    .chip[aria-pressed="true"]{background:#23534f;border-color:var(--mint);color:#fff}
    .ghost:hover,.chip:hover{border-color:var(--mint);color:#fff}
    .counter{color:var(--muted);font-size:.9rem}
    .progress{height:7px;background:#1b2a43;border-radius:999px;overflow:hidden;margin-bottom:18px}
    .progress>span{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#4bc9b2,#b5f5c5);transition:width .3s}
    .stage{perspective:1200px}
    .card{display:block;position:relative;width:100%;height:450px;border:0;padding:0;text-align:right;color:var(--text);background:transparent;border-radius:26px;perspective:inherit}
    .card-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
    .card.is-flipped .card-inner{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto;border:1px solid #36506e;border-radius:26px;padding:clamp(22px,4.5vw,42px);box-shadow:0 25px 60px #0005}
    .front{background:linear-gradient(145deg,#192d4b 0%,#15253e 60%,#15363d 100%)}
    .back{background:linear-gradient(145deg,#163a40 0%,#15283f 70%);transform:rotateY(180deg)}
    .face-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.82rem}
    .topic{color:var(--mint);font-weight:700}
    .question{margin:auto 0;max-width:800px;font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.8;font-weight:700;white-space:pre-line}
    .hint{color:var(--muted);font-size:.85rem;margin:0}
    .answer-title{color:var(--mint);font-size:.78rem;font-weight:700;margin:14px 0 4px}
    .answer{margin:0 0 12px;font-size:clamp(.96rem,2vw,1.1rem);font-weight:600;white-space:pre-line}
    .schema-label{color:var(--gold);font-size:.76rem;font-weight:700;margin:0 0 7px}
    .schema{display:flex;flex-wrap:wrap;align-items:stretch;gap:7px;direction:rtl;margin-bottom:12px}
    .node{flex:1 1 125px;display:grid;place-items:center;min-height:48px;padding:7px 12px;text-align:center;border:1px solid #416d73;background:#1c4249;color:#ebfffa;border-radius:12px;font-size:.87rem;line-height:1.6;white-space:pre-line}
    .arrow{align-self:center;color:var(--gold);font-size:1.25rem;font-weight:700}
    .why{margin:0;border-right:3px solid var(--gold);padding:2px 12px 2px 0;color:#d9e8ed;font-size:.88rem;white-space:pre-line}
    .controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
    .primary{border:0;background:var(--mint);color:#082b2b;font-weight:800;padding:11px 24px;border-radius:13px}
    .primary:hover{background:#a7f4d9}
    .secondary{border:1px solid var(--line);background:#1b2c46;color:var(--text);padding:10px 18px;border-radius:13px}
    .secondary:hover{border-color:var(--mint)}
    .secondary[disabled]{opacity:.35;cursor:not-allowed}
    .known[aria-pressed="true"]{border-color:var(--mint);color:var(--mint)}
    .stats{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:.82rem;margin-top:23px;border-top:1px solid var(--line);padding-top:18px}
    .stats strong{color:var(--mint)}
    code{font-family:Consolas,"Courier New",monospace;color:#ffda9f;direction:ltr;unicode-bidi:isolate;white-space:normal}
    .course-summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .summary-pill{border:1px solid var(--line);background:#101d31;border-radius:999px;color:var(--muted);padding:3px 11px;font-size:.78rem}
    @media(max-width:700px){.wrap{padding-top:12px}.course-nav{position:static;display:block}.brand{margin-bottom:10px}.course-tabs{justify-content:flex-start}header{display:block}.badge{display:inline-block;margin-top:16px}.card{height:530px}.face{padding:22px}.schema{gap:5px}.node{flex-basis:105px;min-height:45px;font-size:.77rem}.arrow{font-size:1rem}.controls{gap:8px}.controls button{padding:9px 13px}}
    @media(prefers-reduced-motion:reduce){.card-inner{transition:none}.progress>span{transition:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="course-nav" aria-label="منوی درس‌ها">
      <div class="brand"><span class="brand-mark">H</span><span>مرکز فلش‌کارت‌ها</span></div>
      <div class="course-tabs" id="course-tabs"></div>
    </nav>
    <header>
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="page-title"></h1>
        <p class="intro" id="intro"></p>
        <div class="course-summary" id="course-summary"></div>
      </div>
      <span class="badge">MAKE FLASHCARDS · پاسخ + طرح‌واره</span>
    </header>
    <section aria-label="فیلتر و پیشرفت">
      <div class="toolbar"><div class="chips" id="filters"></div><span class="counter" id="counter" aria-live="polite"></span></div>
      <div class="progress" role="progressbar" aria-label="پیشرفت مرور" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span id="progress-fill"></span></div>
    </section>
    <section class="stage" aria-label="فلش‌کارت">
      <button class="card" id="card" type="button" aria-label="نمایش پاسخ کارت">
        <span class="card-inner">
          <span class="face front">
            <span class="face-top"><span class="topic" id="front-topic"></span><span id="front-no"></span></span>
            <span class="question" id="question"></span>
            <span class="hint">اول خودت جواب بده؛ سپس روی کارت کلیک کن یا کلید فاصله را بزن ↶</span>
          </span>
          <span class="face back" aria-hidden="true">
            <span class="face-top"><span class="topic" id="back-topic"></span><span>پشت کارت · پاسخ</span></span>
            <span class="answer-title">پاسخ کوتاه</span>
            <span class="answer" id="answer"></span>
            <span class="schema-label">طرح‌وارهٔ فهم</span>
            <span class="schema" id="schema"></span>
            <span class="why" id="why"></span>
          </span>
        </span>
      </button>
    </section>
    <nav class="controls" aria-label="کنترل کارت‌ها">
      <button class="secondary" id="prev" type="button">→ قبلی</button>
      <button class="primary" id="flip" type="button">نمایش پاسخ</button>
      <button class="secondary" id="next" type="button">بعدی ←</button>
      <button class="secondary known" id="known" type="button" aria-pressed="false">✓ یاد گرفتم</button>
    </nav>
    <div class="stats"><span id="known-count"></span><span>کلیدهای ← و → برای جابه‌جایی · فاصله برای برگرداندن</span><button class="ghost" id="shuffle" type="button">آمیختن کارت‌ها ↻</button></div>
  </main>
  <script>
    const courses={
      js:{
        menu:'JavaScript', eyebrow:'LEARN JS · مرور فعال برای هانت وب', title:'۲۰ فلش‌کارت جاوااسکریپت امنیتی', intro:'مبانی JavaScript، DOM، API و نکته‌های امنیتی را با سؤال، پاسخ کوتاه و طرح‌وارهٔ مسیر فکر مرور کن.', storage:'learn-js-known-v1',
        cards:[
          {q:'متغیر چه کاری می‌کند؟',a:'مقداری را با یک نام نگه می‌دارد تا دوباره از آن استفاده کنیم.',s:['مقدار','نام‌گذاری','استفادهٔ دوباره'],w:'مثلاً شناسهٔ کاربر یا پاسخ یک درخواست را نگه می‌داریم.',c:'مبانی'},
          {q:'فرق let و const چیست؟',a:'با let می‌توان مقدار متغیر را دوباره تعیین کرد؛ با const نمی‌توان.',s:['let → تغییر مجاز','const → تعیین دوباره ممنوع'],w:'const از تغییر ناخواستهٔ نام‌های ثابت جلوگیری می‌کند؛ محتوای شیء const همچنان ممکن است تغییر کند.',c:'مبانی'},
          {q:'فرق «42» و 42 چیست؟',a:'اولی متن است؛ دومی عدد.',s:['«42» + 1','«421»'],w:'برای جمع عددی، متن را درست تبدیل کن: Number("42") + 1 برابر 43 می‌شود.',c:'مبانی'},
          {q:'فرق undefined و null چیست؟',a:'undefined یعنی مقداری تعیین نشده؛ null یعنی عمداً مقدار تهی گذاشته شده است.',s:['مقدار نگرفته → undefined','عمداً تهی → null'],w:'هنگام خواندن پاسخ سرور، نبود فیلد و تهی بودن آن را یکی فرض نکن.',c:'مبانی'},
          {q:'NaN چه زمانی دیده می‌شود؟',a:'وقتی یک تبدیل یا محاسبهٔ عددی، عدد معتبر ندهد.',s:['Number("200tl")','تبدیل نامعتبر','NaN'],w:'ورودی عددی را پیش از استفاده بررسی کن؛ typeof NaN با وجود نامش number است.',c:'مبانی'},
          {q:'عملگر === چه چیزی را مقایسه می‌کند؟',a:'هم مقدار و هم نوع داده را مقایسه می‌کند.',s:['"42" : متن','42 : عدد','برابر نیستند'],w:'از برابر شمردن ناخواستهٔ متن و عدد جلوگیری می‌کند.',c:'شرط و تابع'},
          {q:'فرق && و || در شرط چیست؟',a:'&& درست بودن هر دو شرط را می‌خواهد؛ || درست بودن دست‌کم یکی را.',s:['&& → هر دو','|| → یکی کافی است'],w:'★ شرط داخل مرورگر فقط نمایش را کنترل می‌کند؛ مجوز واقعی باید در سرور بررسی شود.',c:'شرط و تابع',sec:true},
          {q:'تابع و پارامتر چه هستند؟',a:'تابع کاری قابل تکرار است و پارامتر ورودی آن کار.',s:['role : ورودی','checkRole(role) : تابع','نتیجه'],w:'در کد، نام تابع را از نام پارامتر جدا بخوان تا مسیر داده را بفهمی.',c:'شرط و تابع'},
          {q:'find در آرایه چه می‌کند؟',a:'اولین عضوی را که با شرط مطابقت دارد برمی‌گرداند.',s:['فهرست کاربران','جست‌وجوی id','اولین کاربر مطابق'],w:'★ پیدا شدن یک کاربر در دادهٔ مرورگر به معنی مجوز دسترسی به او نیست.',c:'داده و شیء',sec:true},
          {q:'نقش را از {user:{role:"editor"}} چگونه می‌خوانیم؟',a:'با data.user.role، اگر این شیء داخل متغیر data باشد.',s:['data','user','role → editor'],w:'role درون user قرار دارد؛ data.role در این ساختار undefined است.',c:'داده و شیء'},
          {q:'فرق JSON.stringify و response.json() چیست؟',a:'اولی داده را به متن JSON برای ارسال تبدیل می‌کند؛ دومی JSON دریافت‌شده را به دادهٔ قابل استفاده می‌خواند.',s:['شیء → JSON.stringify → متن ارسالی','متن دریافتی → response.json() → داده'],w:'جهت تبدیل را هنگام خواندن درخواست و پاسخ قاطی نکن.',c:'درخواست و پاسخ'},
          {q:'document.querySelector("#nameBox") چه می‌کند؟',a:'عنصری را که شناسهٔ nameBox دارد در صفحه پیدا می‌کند.',s:['صفحهٔ HTML','جست‌وجوی #nameBox','عنصر صفحه'],w:'این خط به‌تنهایی هیچ درخواست شبکه‌ای نمی‌فرستد.',c:'صفحه و DOM'},
          {q:'فرق textContent و innerHTML چیست؟',a:'textContent متن را عیناً نشان می‌دهد؛ innerHTML آن را به‌صورت HTML تفسیر می‌کند.',s:['<b>Sara</b>','textContent → علامت‌ها دیده می‌شوند','innerHTML → نام پررنگ'],w:'★ ورود دادهٔ کاربر به innerHTML سرنخ بررسی XSS است؛ پررنگ شدن به‌تنهایی اجرای کد را ثابت نمی‌کند.',c:'صفحه و DOM',sec:true},
          {q:'input.value.trim() چه فایده‌ای دارد؟',a:'مقدار کادر را می‌گیرد و فاصله‌های ابتدا و انتهای آن را حذف می‌کند.',s:['"   "','trim()','""'],w:'★ اعتبارسنجی مرورگر کافی نیست؛ سرور هم باید ورودی را خودش بررسی کند.',c:'صفحه و DOM',sec:true},
          {q:'addEventListener("click", showProfile) چه زمانی تابع را اجرا می‌کند؟',a:'هنگام کلیک روی عنصر، تابع showProfile اجرا می‌شود.',s:['کلیک کاربر','رویداد click','اجرای showProfile'],w:'با دنبال کردن تابع می‌فهمی کدام کلیک باعث درخواست به سرور می‌شود.',c:'صفحه و DOM'},
          {q:'fetch("/api/profile") چه می‌کند؟',a:'از مرورگر به مسیر /api/profile درخواست می‌فرستد؛ روش پیش‌فرض GET است.',s:['مرورگر','GET /api/profile','سرور'],w:'★ از روی مسیرهای fetch می‌توان نقاط ورودی API را در کد پیدا کرد.',c:'درخواست و پاسخ',sec:true},
          {q:'method و headers و body در درخواست POST چه هستند؟',a:'method روش درخواست، headers توضیح قالب داده و body خود دادهٔ ارسالی است.',s:['method: POST','Content-Type: application/json','body: داده'],w:'★ نام Hamid در بدنه می‌رود؛ هدر قالب آن را اعلام می‌کند. سرور باید داده و مجوز را بررسی کند.',c:'درخواست و پاسخ',sec:true},
          {q:'فرق response.status و response.ok چیست؟',a:'status عدد وضعیت مثل 403 است؛ ok فقط برای وضعیت‌های 200 تا 299 درست می‌شود.',s:['پاسخ 403','status → 403','ok → false'],w:'★ پاسخ 403 به‌تنهایی وارد catch نمی‌شود. پاسخ 200 هم اثبات انجام عملیات نیست؛ اثر واقعی را بررسی کن.',c:'درخواست و پاسخ',sec:true},
          {q:'چه وقت response.text() و چه وقت response.json()؟',a:'برای متن ساده از text() و برای بدنهٔ JSON از json() استفاده کن.',s:['Not allowed → text()','{"error":"..."} → json()'],w:'json() روی متن نامعتبر خطا می‌دهد؛ قالب واقعی پاسخ را از هدر و بدنه بخوان.',c:'درخواست و پاسخ'},
          {q:'چه زمانی تغییر شناسه نشانهٔ IDOR است؟',a:'وقتی حساب تو بدون مجوز، داده یا عملیات خصوصی حساب دیگری را دریافت یا اجرا کند.',s:['حساب خودت → شناسهٔ دیگر','بررسی پاسخ و اثر','دسترسی بی‌مجوز → یافته'],w:'★ صرف تغییر /api/users/12 به /api/users/13 یا دریافت 200 کافی نیست؛ اثر واقعی و نبود مجوز را ثابت کن.',c:'درخواست و پاسخ',sec:true}
        ]
      },
      sql:{
        menu:'SQL', eyebrow:'LEARN SQL · از Query پایه تا GROUP BY', title:'۳۷ فلش‌کارت SQL از پایه تا تحلیل گروه‌ها', intro:'تمام مطالب دوره SQL تا اینجا: Query، شرط‌ها، مرتب‌سازی، شمارش، NULL، توابع گروهی، GROUP BY و HAVING.', storage:'learn-sql-known-v1',
        cards:[
          {q:'SQL و MySQL چه فرقی دارند؟',a:'SQL زبان نوشتن دستورهای پایگاه داده است؛ MySQL نرم‌افزاری است که این دستورها را اجرا و داده‌ها را مدیریت می‌کند.',s:['SQL → زبان','Query → دستور','MySQL → اجرا'],w:'مثل زبان فارسی و یک شخص فارسی‌زبان: یکی زبان است و دیگری آن را می‌فهمد و اجرا می‌کند.',c:'مبانی Query'},
          {q:'Query چیست؟',a:'درخواست یا دستوری است که برای خواندن یا تغییر اطلاعات به پایگاه داده می‌فرستیم.',s:['برنامه','Query','پایگاه داده','نتیجه'],w:'SELECT، INSERT، UPDATE و DELETE همگی نوعی Query هستند.',c:'مبانی Query'},
          {q:'Table، Row و Column یعنی چه؟',a:'Table جدول داده‌ها، Row یک ردیف کامل و Column یک ویژگی مانند name یا role است.',s:['Table: users','Row: یک کاربر','Column: name'],w:'هر ردیف معمولاً یک رکورد و هر ستون یک نوع ویژگی را نگه می‌دارد.',c:'مبانی Query'},
          {q:'SELECT name FROM users; چه می‌کند؟',a:'ستون name را از تمام ردیف‌های جدول users نمایش می‌دهد.',s:['SELECT name','FROM users','فهرست نام‌ها'],w:'SELECT مشخص می‌کند چه چیزی نمایش داده شود؛ FROM منبع داده را مشخص می‌کند.',c:'SELECT و WHERE'},
          {q:'برای نمایش name و role با هم چه می‌نویسیم؟',a:'SELECT name, role FROM users;',s:['name','ویرگول','role'],w:'چند ستون بعد از SELECT با ویرگول از هم جدا می‌شوند.',c:'SELECT و WHERE'},
          {q:'علامت * بعد از SELECT چه معنی دارد؟',a:'تمام ستون‌های جدول را انتخاب می‌کند.',s:['SELECT *','تمام ستون‌ها','تمام ردیف‌های بدون شرط'],w:'برای بررسی دقیق بهتر است فقط ستون‌های لازم را درخواست کنیم.',c:'SELECT و WHERE'},
          {q:'WHERE چه کاری می‌کند؟',a:'فقط ردیف‌هایی را نگه می‌دارد که شرط برای آن‌ها درست باشد.',s:['همهٔ ردیف‌ها','WHERE id = 2','فقط ردیف ۲'],w:'اگر هیچ ردیفی مطابق نباشد، معمولاً نتیجه خالی است؛ خود Query الزاماً خطا ندارد.',c:'SELECT و WHERE'},
          {q:'چرا role = \'admin\' کوتیشن دارد ولی id = 2 ندارد؟',a:'admin متن است و باید کوتیشن بگیرد؛ 2 عدد است و بدون کوتیشن نوشته می‌شود.',s:['متن → کوتیشن','عدد → بدون کوتیشن'],w:'نوع داده در مقایسه مهم است؛ ستون و مقدار باید سازگار باشند.',c:'SELECT و WHERE'},
          {q:'عملگرهای =، <>، > و < چه معنی دارند؟',a:'به‌ترتیب: برابر، نابرابر، بزرگ‌تر و کوچک‌تر.',s:['= برابر','<> نابرابر','> بزرگ‌تر','< کوچک‌تر'],w:'مثال: id <> 1 یعنی همهٔ شناسه‌ها به‌جز ۱.',c:'شرط‌ها'},
          {q:'فرق AND و OR چیست؟',a:'AND درست بودن همه شرط‌ها را می‌خواهد؛ OR درست بودن حداقل یک شرط را کافی می‌داند.',s:['AND → همهٔ شرط‌ها','OR → یک شرط کافی'],w:'هر طرف AND یا OR باید یک شرط کامل مانند role = \'user\' باشد.',c:'شرط‌ها'},
          {q:'IN چه کاری می‌کند؟',a:'بررسی می‌کند مقدار ستون یکی از مقدارهای فهرست باشد.',s:['role','IN','(\'admin\', \'editor\')'],w:'IN شکل کوتاه و خوانای چند شرط OR روی یک ستون است.',c:'شرط‌ها'},
          {q:'داخل IN متن‌ها چگونه جدا می‌شوند؟',a:'هر متن داخل کوتیشن و مقدارها با ویرگول جدا می‌شوند.',s:['\'admin\'','ویرگول','\'editor\''],w:'نقطه‌ویرگول پایان کل Query است و جای ویرگول داخل فهرست را نمی‌گیرد.',c:'شرط‌ها'},
          {q:'NOT IN چه کاری می‌کند؟',a:'ردیف‌هایی را انتخاب می‌کند که مقدار ستون داخل فهرست نباشد.',s:['همهٔ ردیف‌ها','حذف مقادیر فهرست','باقی‌مانده'],w:'role NOT IN (\'admin\', \'editor\') کاربران دارای نقش‌های دیگر را می‌دهد.',c:'شرط‌ها'},
          {q:'BETWEEN 2 AND 4 کدام عددها را شامل می‌شود؟',a:'۲، ۳ و ۴؛ هر دو سر بازه هم حساب می‌شوند.',s:['شروع: 2','میان بازه: 3','پایان: 4'],w:'این شرط معادل id >= 2 AND id <= 4 است.',c:'شرط‌ها'},
          {q:'NOT BETWEEN 2 AND 4 چه می‌کند؟',a:'مقدارهای بیرون از بازهٔ ۲ تا ۴ را انتخاب می‌کند.',s:['کمتر از 2','یا','بیشتر از 4'],w:'ابتدا و انتهای بازه نیز داخل بخش حذف‌شده هستند.',c:'شرط‌ها'},
          {q:'برای پیدا کردن ایمیل ثبت‌نشده چه شرطی می‌نویسیم؟',a:'email IS NULL',s:['email','IS NULL','مقدار ثبت‌نشده'],w:'NULL متن نیست؛ email = NULL و email = \'NULL\' معنی موردنظر را ندارند.',c:'NULL و شمارش'},
          {q:'IS NOT NULL چه معنی دارد؟',a:'مقدار ستون ثبت شده و NULL نیست.',s:['ستون','IS NOT NULL','دارای مقدار'],w:'برای پیدا کردن کاربران دارای ایمیل از email IS NOT NULL استفاده می‌کنیم.',c:'NULL و شمارش'},
          {q:'ORDER BY id ASC چه ترتیبی می‌سازد؟',a:'شناسه‌ها را از کوچک به بزرگ مرتب می‌کند.',s:['ASC','1','2','3'],w:'ASC صعودی و DESC نزولی است.',c:'مرتب‌سازی'},
          {q:'ORDER BY id DESC چه ترتیبی می‌سازد؟',a:'شناسه‌ها را از بزرگ به کوچک مرتب می‌کند.',s:['DESC','3','2','1'],w:'برای گرفتن کاربر دارای بیشترین id، DESC را با LIMIT 1 ترکیب می‌کنیم.',c:'مرتب‌سازی'},
          {q:'LIMIT 2 چه اثری دارد؟',a:'فقط دو ردیف اول نتیجهٔ نهایی را نگه می‌دارد.',s:['مرتب‌سازی و فیلتر','نتیجه','دو ردیف اول'],w:'LIMIT معمولاً بعد از ORDER BY نوشته می‌شود تا بدانیم کدام ردیف‌ها اول هستند.',c:'مرتب‌سازی'},
          {q:'الگوهای LIKE چگونه خوانده می‌شوند؟',a:'H% یعنی شروع با H؛ %i یعنی پایان با i؛ %a% یعنی شامل a در هر قسمت.',s:['H% → شروع','%i → پایان','%a% → هرجا'],w:'در PostgreSQL از ILIKE برای جست‌وجوی غیرحساس به حروف استفاده می‌شود؛ رفتار MySQL به collation بستگی دارد.',c:'مرتب‌سازی'},
          {q:'COUNT(*) چه چیزی را می‌شمارد؟',a:'تمام ردیف‌های نتیجه را، حتی اگر بعضی ستون‌ها NULL باشند.',s:['ردیف‌ها','COUNT(*)','تعداد کل'],w:'شرط WHERE می‌تواند پیش از شمارش، ردیف‌های نتیجه را محدود کند.',c:'NULL و شمارش'},
          {q:'COUNT(email) چه تفاوتی با COUNT(*) دارد؟',a:'فقط مقدارهای غیر NULL ستون email را می‌شمارد.',s:['ستون email','حذف NULLها','شمارش باقی‌مانده'],w:'اگر ۴ ردیف و ۲ ایمیل NULL باشد، COUNT(*) برابر ۴ و COUNT(email) برابر ۲ است.',c:'NULL و شمارش'},
          {q:'DISTINCT چه کاری می‌کند؟',a:'مقدارهای تکراری را از خروجی حذف می‌کند.',s:['user, admin, user','DISTINCT','user, admin'],w:'SELECT DISTINCT role فهرست نقش‌های متفاوت را نمایش می‌دهد.',c:'توابع و DISTINCT'},
          {q:'COUNT(DISTINCT role) چه می‌شمارد؟',a:'تعداد نقش‌های متفاوت را می‌شمارد.',s:['roleها','حذف تکراری‌ها','COUNT'],w:'با COUNT(role) فرق دارد؛ آن همه نقش‌های غیر NULL را می‌شمارد.',c:'توابع و DISTINCT'},
          {q:'MIN و MAX چه کاری می‌کنند؟',a:'MIN کوچک‌ترین و MAX بزرگ‌ترین مقدار را پیدا می‌کند.',s:['مقادیر','MIN → کمترین','MAX → بیشترین'],w:'مثلاً MAX(id) بزرگ‌ترین شناسه را برمی‌گرداند.',c:'توابع و DISTINCT'},
          {q:'GROUP BY role چه کاری می‌کند؟',a:'ردیف‌هایی را که role یکسان دارند داخل یک گروه قرار می‌دهد.',s:['ردیف‌های users','GROUP BY role','گروه user / admin / editor'],w:'پس از ساخت گروه‌ها می‌توان COUNT، AVG، SUM، MIN یا MAX هر گروه را محاسبه کرد.',c:'GROUP BY'},
          {q:'SELECT role, COUNT(*) FROM users GROUP BY role چه خروجی می‌دهد؟',a:'برای هر نقش یک ردیف و تعداد اعضای همان نقش را می‌دهد.',s:['گروه role','COUNT اعضا','یک ردیف برای هر نقش'],w:'تعداد ردیف‌های خروجی برابر تعداد نقش‌های متفاوت است.',c:'GROUP BY'},
          {q:'WHERE نسبت به GROUP BY چه زمانی اجرا می‌شود؟',a:'WHERE قبل از گروه‌بندی، ردیف‌های منفرد را فیلتر می‌کند.',s:['FROM','WHERE','GROUP BY'],w:'مثلاً WHERE age > 20 افراد را حذف می‌کند و بعد افراد باقی‌مانده گروه‌بندی می‌شوند.',c:'GROUP BY'},
          {q:'HAVING چه کاری می‌کند؟',a:'بعد از گروه‌بندی، خود گروه‌ها را براساس نتیجهٔ محاسبه فیلتر می‌کند.',s:['GROUP BY','COUNT یا AVG','HAVING'],w:'مثلاً HAVING COUNT(*) >= 2 فقط گروه‌های حداقل دوتایی را نگه می‌دارد.',c:'HAVING و ترتیب'},
          {q:'فرق WHERE و HAVING چیست؟',a:'WHERE ردیف‌ها را قبل از گروه‌بندی؛ HAVING گروه‌ها را بعد از محاسبه فیلتر می‌کند.',s:['یک فرد؟ → WHERE','یک گروه؟ → HAVING'],w:'WHERE age > 20 فردی است؛ HAVING AVG(age) > 20 گروهی است.',c:'HAVING و ترتیب'},
          {q:'AS در COUNT(*) AS total چه می‌کند؟',a:'فقط برای ستون خروجی نام خواناتر total می‌سازد.',s:['COUNT(*)','AS total','ستون total'],w:'AS داده‌های اصلی جدول را تغییر نمی‌دهد.',c:'HAVING و ترتیب'},
          {q:'ORDER BY total DESC بعد از گروه‌بندی چه می‌کند؟',a:'گروه‌ها را از بیشترین total به کمترین مرتب می‌کند.',s:['نتیجه گروه‌ها','ORDER BY total','DESC'],w:'می‌توان نام مستعار ساخته‌شده با AS را در ORDER BY استفاده کرد.',c:'HAVING و ترتیب'},
          {q:'AVG(age) و SUM(age) چه تفاوتی دارند؟',a:'AVG میانگین سن و SUM مجموع سن‌ها را محاسبه می‌کند.',s:['سن‌های گروه','SUM → جمع','AVG → جمع ÷ تعداد'],w:'هر دو را می‌توان همراه GROUP BY برای هر نقش جدا حساب کرد.',c:'توابع گروهی'},
          {q:'MIN، MAX، AVG و SUM چگونه برای هر نقش محاسبه می‌شوند؟',a:'با انتخاب role، تابع موردنظر و سپس GROUP BY role.',s:['SELECT role, تابع(age)','FROM users','GROUP BY role'],w:'هر تابع فقط روی اعضای همان گروه محاسبه می‌شود.',c:'توابع گروهی'},
          {q:'ترتیب صحیح بخش‌های اصلی Query چیست؟',a:'SELECT، FROM، WHERE، GROUP BY، HAVING، ORDER BY، LIMIT',s:['SELECT / FROM','WHERE','GROUP BY / HAVING','ORDER BY / LIMIT'],w:'برای تشخیص خطا، اول ترتیب بخش‌ها را بررسی کن: WHERE قبل و HAVING بعد از GROUP BY است.',c:'HAVING و ترتیب'},
          {q:'این Query چه مسیری دارد؟\nSELECT role, AVG(age) AS average_age FROM users WHERE age > 20 GROUP BY role HAVING AVG(age) > 25;',a:'افراد بالای ۲۰ سال را انتخاب می‌کند، براساس نقش گروه می‌سازد، میانگین سن هر گروه را حساب می‌کند و فقط میانگین‌های بیشتر از ۲۵ را نگه می‌دارد.',s:['WHERE age > 20','GROUP BY role','AVG(age)','HAVING > 25'],w:'این کارت مسیر کامل یک Query گروهی را از ردیف خام تا خروجی نهایی نشان می‌دهد.',c:'Query ترکیبی'}
        ]
      }
    };

    const $=id=>document.getElementById(id);
    let courseKey=new URLSearchParams(location.search).get('course')==='sql'?'sql':'js';
    let filter='همه',order=[],at=0,flipped=false,known=new Set();
    const course=()=>courses[courseKey];
    const cards=()=>course().cards;
    function categories(){return ['همه',...new Set(cards().map(card=>card.c)),'★ امنیتی','مرور دوباره']}
    function loadKnown(){known=new Set();try{known=new Set(JSON.parse(localStorage.getItem(course().storage)||'[]'))}catch{} }
    function saveKnown(){try{localStorage.setItem(course().storage,JSON.stringify([...known]))}catch{} }
    function resetCourseState(){filter='همه';at=0;flipped=false;order=cards().map((_,i)=>i);loadKnown()}
    function visible(){return order.filter(i=>filter==='همه'||filter==='★ امنیتی'&&cards()[i].sec||filter==='مرور دوباره'&&!known.has(i)||cards()[i].c===filter)}
    function drawCourseTabs(){
      $('course-tabs').replaceChildren();
      Object.entries(courses).forEach(([key,value])=>{const b=document.createElement('button');b.className='course-tab';b.type='button';b.textContent=`درس ${value.menu} · ${value.cards.length} کارت`;b.setAttribute('aria-pressed',String(courseKey===key));b.onclick=()=>switchCourse(key);$('course-tabs').append(b)})
    }
    function switchCourse(key){if(key===courseKey)return;courseKey=key;const url=new URL(location);url.searchParams.set('course',key);history.replaceState({},'',url);resetCourseState();drawCourseTabs();drawHeader();drawFilters();render()}
    function drawHeader(){
      $('eyebrow').textContent=course().eyebrow;$('page-title').textContent=course().title;$('intro').textContent=course().intro;
      $('course-summary').replaceChildren();const topics=new Set(cards().map(card=>card.c));[`تعداد کارت: ${cards().length}`,`سرفصل: ${topics.size}`,`ذخیرهٔ پیشرفت: فعال`].forEach(text=>{const s=document.createElement('span');s.className='summary-pill';s.textContent=text;$('course-summary').append(s)})
      document.title=`${course().menu} · فلش‌کارت‌های حمید`;
    }
    function drawFilters(){$('filters').replaceChildren();categories().forEach(label=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(filter===label));b.onclick=()=>{filter=label;at=0;flipped=false;drawFilters();render()};$('filters').append(b)})}
    function flip(force){flipped=typeof force==='boolean'?force:!flipped;$('card').classList.toggle('is-flipped',flipped);$('card').setAttribute('aria-label',flipped?'نمایش سؤال کارت':'نمایش پاسخ کارت');$('flip').textContent=flipped?'نمایش سؤال':'نمایش پاسخ';document.querySelector('.back').setAttribute('aria-hidden',String(!flipped))}
    function render(){
      const v=visible();if(at>=v.length)at=Math.max(0,v.length-1);const i=v[at];
      $('counter').textContent=v.length?`کارت ${at+1} از ${v.length}`:'همهٔ این کارت‌ها را یاد گرفته‌ای!';$('known-count').innerHTML=`یادگرفته‌ها در ${course().menu}: <strong>${known.size} از ${cards().length}</strong>`;$('progress').setAttribute('aria-valuenow',String(v.length?Math.round((at+1)/v.length*100):100));$('progress-fill').style.width=`${v.length?(at+1)/v.length*100:100}%`;$('prev').disabled=at===0;$('next').disabled=at>=v.length-1;$('flip').disabled=!v.length;$('known').disabled=!v.length;
      if(!v.length){$('question').textContent='آفرین! کارت دیگری در این بخش نمانده است.';$('answer').textContent='از فیلتر «همه» دوباره شروع کن.';$('schema').replaceChildren();$('why').textContent='';$('front-topic').textContent='مرور کامل';$('back-topic').textContent='';$('front-no').textContent='';flip(false);return}
      const card=cards()[i];$('front-topic').textContent=card.sec?'★ '+card.c:card.c;$('back-topic').textContent=card.sec?'★ نکتهٔ امنیتی · '+card.c:card.c;$('front-no').textContent=`${i+1} / ${cards().length}`;$('question').textContent=card.q;$('answer').textContent=card.a;$('why').textContent=card.w;$('schema').replaceChildren();card.s.forEach((step,n)=>{if(n){const arrow=document.createElement('span');arrow.className='arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='←';$('schema').append(arrow)}const node=document.createElement('span');node.className='node';node.textContent=step;$('schema').append(node)});$('known').setAttribute('aria-pressed',String(known.has(i)));$('known').textContent=known.has(i)?'✓ یاد گرفته‌ام':'✓ یاد گرفتم';flip(false)
    }
    $('card').onclick=()=>{if(visible().length)flip()};$('flip').onclick=()=>flip();$('prev').onclick=()=>{if(at>0){at--;render()}};$('next').onclick=()=>{if(at<visible().length-1){at++;render()}};
    $('known').onclick=()=>{const i=visible()[at];if(i===undefined)return;known.has(i)?known.delete(i):known.add(i);saveKnown();if(filter==='مرور دوباره')render();else{$('known').setAttribute('aria-pressed',String(known.has(i)));$('known').textContent=known.has(i)?'✓ یاد گرفته‌ام':'✓ یاد گرفتم';$('known-count').innerHTML=`یادگرفته‌ها در ${course().menu}: <strong>${known.size} از ${cards().length}</strong>`}};
    $('shuffle').onclick=()=>{const current=visible()[at];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}at=Math.max(0,visible().indexOf(current));render()};
    document.addEventListener('keydown',e=>{if(e.target instanceof HTMLElement&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='ArrowLeft'&&at<visible().length-1){at++;render()}else if(e.code==='ArrowRight'&&at>0){at--;render()}else if(e.code==='Space'&&e.target!==$('card')){e.preventDefault();if(visible().length)flip()}});
    resetCourseState();drawCourseTabs();drawHeader();drawFilters();render();
  </script>
</body>
</html>
